name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'pages/**'
      - 'public/**'
      - '.vitepress/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO_URL: "mzketto/mzketto.github.io"
      BUILD_PATH: ".vitepress/dist"
      CUSTOM_DOMAIN: "ketto.zz.ac"

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install pnpm
        run: npm install -g pnpm

      # 新增：配置 pnpm 允许必要的构建脚本
      - name: Configure pnpm to allow build scripts
        run: |
          # 创建或更新 pnpm-workspace.yaml，添加 allowBuilds 配置
          if [ ! -f pnpm-workspace.yaml ]; then
            echo "allowBuilds:" > pnpm-workspace.yaml
          else
            if ! grep -q "^allowBuilds:" pnpm-workspace.yaml; then
              echo "allowBuilds:" >> pnpm-workspace.yaml
            fi
          fi
          # 添加报错中提到的包
          grep -q "@parcel/watcher" pnpm-workspace.yaml || echo "  '@parcel/watcher': true" >> pnpm-workspace.yaml
          grep -q "esbuild" pnpm-workspace.yaml || echo "  esbuild: true" >> pnpm-workspace.yaml
          grep -q "vue-demi" pnpm-workspace.yaml || echo "  vue-demi: true" >> pnpm-workspace.yaml
          echo "当前 pnpm-workspace.yaml 内容："
          cat pnpm-workspace.yaml

      - name: Install dependencies and build
        run: |
          pnpm install
          pnpm build

      - name: Deploy to GitHub Pages
        run: |
          cd $BUILD_PATH
          echo "$CUSTOM_DOMAIN" > CNAME
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git init
          git add .
          git commit -m "Deploy to GitHub Pages"
          git checkout -B pages
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ env.REPO_URL }}.git
          git push --force origin pages
        env:
          CI: true
